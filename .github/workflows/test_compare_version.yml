name: Test compare version

on:
  workflow_dispatch: 

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Замени на ${{ secrets.PACKAGE_TOKEN }} для PAT
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: dns-proxy-ros
      PACKAGE_NAME_ENCODED: dns-proxy-ros
      DELETE_UNTAGGED: "true"

    steps:
      # 1
      - name: Install jq and crane
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -C /usr/local/bin -xz crane
          chmod +x /usr/local/bin/crane
          crane version || { echo "Crane failed to install"; exit 1; }

      # 2
      - name: Log in to GHCR with crane
        run: echo "${GITHUB_TOKEN}" | crane auth login ghcr.io -u ${PACKAGE_OWNER} --password-stdin

      # 3
      - name: Get latest stable dnsproxy tag
        id: dnsproxy_tag
        run: |
          DNS_PROXY_TAG=$(curl -s https://api.github.com/repos/AdguardTeam/dnsproxy/releases/latest | jq -r '.tag_name' || echo "")
          if [ -z "$DNS_PROXY_TAG" ]; then
            echo "No stable tag found in AdguardTeam/dnsproxy, skipping build"
            echo "DNS_PROXY_TAG=" >> $GITHUB_ENV
          else
            echo "Latest stable dnsproxy tag: $DNS_PROXY_TAG"
            echo "DNS_PROXY_TAG=$DNS_PROXY_TAG" >> $GITHUB_ENV
          fi

      # 4
      - name: Get current latest tag from Docker Hub
        id: current_tag_dockerhub
        run: |
          RESPONSE=$(curl -s -L -w "%{http_code}" "https://hub.docker.com/v2/repositories/medium1992/dns-proxy-ros/tags")
          HTTP_STATUS=$(tail -n1 <<< "$RESPONSE")
          BODY=$(sed '$d' <<< "$RESPONSE")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Docker Hub API error or repo not found, assuming no tags"
            echo "CURRENT_TAG_DOCKERHUB=none" >> $GITHUB_ENV
          else
            TAGS=$(echo "$BODY" | jq -r '.results[].name // empty' || echo "")
            LATEST_VERSION_TAG=$(echo "$TAGS" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || echo "none")
            echo "CURRENT_TAG_DOCKERHUB=$LATEST_VERSION_TAG" >> $GITHUB_ENV
          fi

      # 5
      - name: Get current latest tag from GHCR
        id: current_tag_ghcr
        run: |
          TAGS=$(crane ls ghcr.io/${PACKAGE_OWNER}/${PACKAGE_NAME} 2>/dev/null || echo "")
          CURRENT_TAG_GHCR=$(echo "$TAGS" | grep -E '^latest$|^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || echo "none")
          if [ "$CURRENT_TAG_GHCR" = "none" ]; then
            echo "No tag found in GHCR, assuming first build"
            echo "CURRENT_TAG_GHCR=none" >> $GITHUB_ENV
          else
            echo "Current latest tag in GHCR: $CURRENT_TAG_GHCR"
            echo "CURRENT_TAG_GHCR=$CURRENT_TAG_GHCR" >> $GITHUB_ENV
          fi

      # 6
      - name: Compare tags for Docker Hub
        id: compare_dockerhub
        if: env.DNS_PROXY_TAG != '' && env.CURRENT_TAG_DOCKERHUB != 'none'
        run: |
          if [ "$DNS_PROXY_TAG" != "$CURRENT_TAG_DOCKERHUB" ]; then
            echo "New stable version detected for Docker Hub: $DNS_PROXY_TAG (current: $CURRENT_TAG_DOCKERHUB)"
            echo "BUILD_DOCKERHUB=true" >> $GITHUB_ENV
          else
            echo "No new stable version for Docker Hub. dnsproxy: $DNS_PROXY_TAG, current: $CURRENT_TAG_DOCKERHUB"
            echo "BUILD_DOCKERHUB=false" >> $GITHUB_ENV
          fi
          echo "VERSION=$DNS_PROXY_TAG" >> $GITHUB_ENV

      # 7
      - name: Compare tags for GHCR
        id: compare_ghcr
        if: env.DNS_PROXY_TAG != '' && env.CURRENT_TAG_GHCR != 'none'
        run: |
          if [ "$DNS_PROXY_TAG" != "$CURRENT_TAG_GHCR" ]; then
            echo "New stable version detected for GHCR: $DNS_PROXY_TAG (current: $CURRENT_TAG_GHCR)"
            echo "BUILD_GHCR=true" >> $GITHUB_ENV
          else
            echo "No new stable version for GHCR. dnsproxy: $DNS_PROXY_TAG, current: $CURRENT_TAG_GHCR"
            echo "BUILD_GHCR=false" >> $GITHUB_ENV
          fi
          echo "VERSION=$DNS_PROXY_TAG" >> $GITHUB_ENV