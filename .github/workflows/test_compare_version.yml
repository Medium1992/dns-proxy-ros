name: Test Docker Hub Cleanup

on:
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: dns-proxy-ros
      DELETE_UNTAGGED: "false" # "false" для dry-run, "true" для удаления

    steps:
      # 1
      - name: Install jq and crane
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -C /usr/local/bin -xz crane
          chmod +x /usr/local/bin/crane
          crane version || { echo "Crane failed to install"; exit 1; }

      # 2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3
      - name: Analyze Docker Hub packages (dry-run)
        id: analyze_dockerhub
        run: |
          set -e

          echo "Fetching tags for ${PACKAGE_OWNER}/${PACKAGE_NAME} on Docker Hub..."
          page=1
          tags_json="[]"
          last_tag=""
          while true; do
            echo "Fetching page $page..."
            response=$(curl -s -L -w "%{http_code}" "https://hub.docker.com/v2/repositories/${PACKAGE_OWNER}/${PACKAGE_NAME}/tags/?page_size=100&page=$page" -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_PASSWORD}")
            http_status=$(tail -n1 <<< "$response")
            body=$(sed '$d' <<< "$response")
            if [ "$http_status" -ne 200 ]; then
              echo "Docker Hub API error or repo not found on page $page (status: $http_status)"
              break
            fi
            echo "Page $page raw chunk: ${body:0:50}..."
            tag_count=$(echo "$body" | jq -r '.results | length // 0')
            echo "Page $page: $tag_count tags"
            if [ "$tag_count" -eq 0 ]; then
              echo "No more tags on page $page (empty response)"
              break
            fi
            last_tag=$(echo "$body" | jq -r '.results[-1].name // ""')
            if [ -n "$last_tag" ] && [ "$last_tag" == "$prev_last_tag" ]; then
              echo "Page $page has same data as previous (last tag: $last_tag), stopping"
              break
            fi
            prev_last_tag="$last_tag"
            if [ "$tags_json" == "[]" ]; then
              tags_json="$body"
            else
              tags_json=$(jq -s '.[0].results + .[1].results | {results: .}' <(echo "$tags_json") <(echo "$body"))
            fi
            ((page++))
            if [ $page -gt 10 ]; then
              echo "Reached max page limit (10)"
              break
            fi
          done

          total=$(echo "$tags_json" | jq -r '.results | length // 0')
          echo "Total tags found: $total (pages processed: $((page-1)))"
          echo ""

          declare -A protected_digests
          declare -A child_digests

          echo "=== 🏷️ Tagged manifests ==="
          for row in $(echo "$tags_json" | jq -r '.results[] | @base64'); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            name=$(_jq '.name')
            digest=$(_jq '.images[0].digest // "unknown"')
            created=$(_jq '.last_updated // "unknown"')
            if [ "$digest" != "unknown" ]; then
              protected_digests[$digest]=1
              echo "  📦 Inspecting manifest for tag: [$name] | Digest: $digest | Created: $created"
              manifest_json=$(timeout 10s crane manifest ${PACKAGE_OWNER}/${PACKAGE_NAME}:${name} 2>/dev/null || echo "{}")
              sub_digests=$(echo "$manifest_json" | jq -r '.manifests[].digest // empty')
              for sd in $sub_digests; do
                if [ -n "$sd" ]; then
                  child_digests[$sd]=1
                  protected_digests[$sd]=1
                  echo "    → Protected child digest: $sd"
                fi
              done
            fi
          done

          echo ""
          echo "Protected digests count: ${#protected_digests[@]}"
          echo ""

          echo "=== 🧩 Untagged images ==="
          # Используем crane для получения всех digest'ов
          all_digests=$(crane catalog ${PACKAGE_OWNER}/${PACKAGE_NAME} 2>/dev/null | while read -r tag; do crane manifest ${PACKAGE_OWNER}/${PACKAGE_NAME}:$tag 2>/dev/null | jq -r '.config.digest // empty'; done | sort -u)
          untagged_digests=()
          for digest in $all_digests; do
            if [ -z "${protected_digests[$digest]}" ] && [ -n "$digest" ]; then
              echo "- Digest: $digest → 🧹 кандидат на удаление"
              untagged_digests+=("$digest")
            fi
          done

          echo ""
          echo "Untagged digests (candidates for removal): ${untagged_digests[*]}"
          if [ ${#untagged_digests[@]} -eq 0 ]; then
            echo "No untagged digests to delete"
            echo "untagged_digests_comma=" >> $GITHUB_OUTPUT
          else
            untagged_digests_comma=$(echo "${untagged_digests[*]}" | tr ' ' ', ')
            echo "untagged_digests_comma=$untagged_digests_comma" >> $GITHUB_OUTPUT
          fi

      # 4
      - name: Cleanup untagged Docker Hub versions
        if: env.DELETE_UNTAGGED == 'true' && steps.analyze_dockerhub.outputs.untagged_digests_comma != ''
        run: |
          echo "Dry-run: Would delete digests: ${{ steps.analyze_dockerhub.outputs.untagged_digests_comma }}"
          echo "Note: Manual deletion via Docker Hub API or 'docker rmi' is required for these digests."
          # Для реального удаления нужно использовать Docker Hub API или docker CLI с авторизацией
          # Пример: docker rmi ${PACKAGE_OWNER}/${PACKAGE_NAME}@${{ steps.analyze_dockerhub.outputs.untagged_digests_comma }}