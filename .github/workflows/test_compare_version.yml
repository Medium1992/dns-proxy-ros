name: Test Docker Hub Cleanup

on:
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PACKAGE_OWNER: medium1992
      PACKAGE_NAME: dns-proxy-ros
      DELETE_UNTAGGED: "false" # "false" для dry-run, "true" для удаления

    steps:
      # 1
      - name: Install jq and crane
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -sL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | sudo tar -C /usr/local/bin -xz crane
          chmod +x /usr/local/bin/crane
          crane version || { echo "Crane failed to install"; exit 1; }

      # 2
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3
      - name: Analyze Docker Hub packages (dry-run)
        id: analyze_dockerhub
        run: |
          set -e

          echo "Fetching tags for ${PACKAGE_OWNER}/${PACKAGE_NAME} on Docker Hub..."
          page=1
          tags_json="[]"
          while true; do
            echo "Fetching page $page..."
            response=$(curl -s -L -w "%{http_code}" "https://hub.docker.com/v2/repositories/${PACKAGE_OWNER}/${PACKAGE_NAME}/tags/?page_size=100&page=$page" -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}")
            http_status=$(tail -n1 <<< "$response")
            body=$(sed '$d' <<< "$response")
            if [ "$http_status" -ne 200 ]; then
              echo "Docker Hub API error on page $page (status: $http_status)"
              break
            fi
            tag_count=$(echo "$body" | jq -r '.results | length // 0')
            echo "Page $page: $tag_count tags"
            if [ "$tag_count" -eq 0 ]; then
              echo "No more tags on page $page"
              break
            fi
            if [ "$tags_json" == "[]" ]; then
              tags_json="$body"
            else
              tags_json=$(jq -s '.[0].results + .[1].results | {results: .}' <(echo "$tags_json") <(echo "$body"))
            fi
            ((page++))
            if [ $page -gt 10 ]; then
              echo "Reached max page limit (10)"
              break
            fi
          done

          total=$(echo "$tags_json" | jq -r '.results | length // 0')
          echo "Total tags found: $total"
          echo ""

          # Получаем Bearer токен для доступа к манифестам
          echo "Getting Bearer token..."
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${PACKAGE_OWNER}/${PACKAGE_NAME}:pull" -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Failed to get Bearer token"
            exit 1
          fi
          echo "Bearer token obtained successfully"

          declare -A protected_digests
          declare -A child_digests

          echo "=== 🏷️ Tagged manifests ==="
          for row in $(echo "$tags_json" | jq -r '.results[] | @base64'); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            name=$(_jq '.name')
            created=$(_jq '.last_updated // "unknown"')
            echo "  📦 Inspecting manifest for tag: [$name] | Created: $created"
            
            # Получаем манифест с Bearer токеном
            manifest_json=$(curl -s -L -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.docker.distribution.manifest.list+v2+json" \
              "https://registry-1.docker.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/${name}" 2>/dev/null || echo "{}")
            
            # Извлекаем основной digest манифеста
            manifest_digest=$(curl -s -I -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.docker.distribution.manifest.list+v2+json" \
              "https://registry-1.docker.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/${name}" | grep -i Docker-Content-Digest | head -1 | awk '{print $2}' | tr -d '\r')
            
            if [ -n "$manifest_digest" ]; then
              protected_digests[$manifest_digest]=1
              echo "    → Protected manifest digest: $manifest_digest"
            fi
            
            # Извлекаем дочерние digest'ы
            sub_digests=$(echo "$manifest_json" | jq -r '.manifests[]?.digest // empty' || echo "")
            for sd in $sub_digests; do
              if [ -n "$sd" ]; then
                child_digests[$sd]=1
                protected_digests[$sd]=1
                echo "    → Protected child digest: $sd"
              fi
            done
          done

          echo ""
          echo "Protected digests count: ${#protected_digests[@]}"
          echo ""

          echo "=== 🧩 Untagged images ==="
          # Собираем все доступные digest'ы из манифестов
          all_digests=""
          for tag in $(echo "$tags_json" | jq -r '.results[].name // empty'); do
            manifest=$(curl -s -L -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.docker.distribution.manifest.list+v2+json" \
              "https://registry-1.docker.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/${tag}" 2>/dev/null || echo "{}")
            digests=$(echo "$manifest" | jq -r '.manifests[]?.digest // empty' || echo "")
            all_digests="$all_digests $digests"
          done
          # Добавляем digest'ы из тегов
          for row in $(echo "$tags_json" | jq -r '.results[].images[] | @base64'); do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            image_digest=$(_jq '.digest // empty')
            if [ -n "$image_digest" ]; then
              all_digests="$all_digests $image_digest"
            fi
          done
          # Добавляем проверку известных старых digest'ов (временное решение)
          known_digests="sha256:b845fff506649f6d6aa5bbff7c8468d5c4a33af86d507a085f402985bc809545 sha256:89e83857e1851d95d904861a7ef790eae879629b4b3c3a3471307388e37ef45f sha256:d0007a857cc82ed8f1ccc7197f8fde2eafeb8377c7f3e18662b66b8dd84c014d"
          for digest in $known_digests; do
            response=$(curl -s -I -H "Authorization: Bearer $TOKEN" \
              "https://registry-1.docker.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/$digest" 2>/dev/null | grep -i HTTP | awk '{print $2}')
            if [ "$response" = "200" ]; then
              all_digests="$all_digests $digest"
            fi
          done
          all_digests=$(echo "$all_digests" | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "All collected digests (${#all_digests[@]}): $all_digests"
          
          untagged_digests=()
          for digest in $all_digests; do
            if [ -z "${protected_digests[$digest]}" ] && [ -n "$digest" ]; then
              echo "- Digest: $digest → 🧹 кандидат на удаление"
              untagged_digests+=("$digest")
            else
              echo "- Digest: $digest → 🛡 защищён (связан с тегом)"
            fi
          done

          echo ""
          echo "Untagged digests (candidates for removal): ${untagged_digests[*]}"
          if [ ${#untagged_digests[@]} -eq 0 ]; then
            echo "No untagged digests to delete"
            echo "untagged_digests_comma=" >> $GITHUB_OUTPUT
          else
            untagged_digests_comma=$(echo "${untagged_digests[*]}" | tr ' ' ', ')
            echo "untagged_digests_comma=$untagged_digests_comma" >> $GITHUB_OUTPUT
          fi

      # 4
      - name: Cleanup untagged Docker Hub versions
        if: env.DELETE_UNTAGGED == 'true' && steps.analyze_dockerhub.outputs.untagged_digests_comma != ''
        run: |
          echo "Deleting untagged digests: ${{ steps.analyze_dockerhub.outputs.untagged_digests_comma }}"
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${PACKAGE_OWNER}/${PACKAGE_NAME}:delete" -u "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Failed to get Bearer token for deletion"
            exit 1
          fi
          for digest in $(echo "${{ steps.analyze_dockerhub.outputs.untagged_digests_comma }}" | tr ',' ' '); do
            echo "Deleting manifest: $digest"
            curl -s -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "https://registry-1.docker.io/v2/${PACKAGE_OWNER}/${PACKAGE_NAME}/manifests/$digest" || echo "Failed to delete $digest"
          done